name: Privacidade

# Barra a entrada de dado real no repositório antes de ele ficar público.
# Roda a mesma régua do v2 (`tests/test_sem_telefone_real.py`), na versão de
# bolso: scripts/varrer_privacidade.py sai com código 1 ao achar telefone ou
# e-mail fora do padrão sintético (máscara XXX..., 3333-00NN, 99999-000N,
# 0000-0000, @exemplo.jus.br e o que estiver em .privacidade-sinteticos).
#
# Marca institucional, referência a Ofício/SEI e honorífico são listados no log
# como aviso, sem derrubar o job: são decisão de identidade do dono do projeto.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  varredura:
    name: Varrer telefone e e-mail
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Varrer dado real
        run: python3 scripts/varrer_privacidade.py

name: Docs (SHAs citados e contagens)

# Dois checks informativos, de proposito **fora** dos required checks do ruleset
# `protege-default`: os scripts saem com 0 e o sinal e `::warning` na linha do
# arquivo, na aba "Files changed" do PR. O modo `--estrito` (codigo 1) existe
# para o checklist de envio ao revisor, nao para travar merge de documentacao.
#
# 1. `shas` — SHA citado nos .md tem de ser ancestral da `main`, nao apenas
#    existir como objeto. Foi assim que duas rodadas foram revisar um retrato
#    vencido (tip de PR fechado por squash). Por isso `fetch-depth: 0`: clone
#    raso nao tem a historia para `git merge-base --is-ancestor` medir.
# 2. `contagens` — o manifesto `.contagens` contra as declaracoes canonicas do
#    README. Nao carimba todo `N contatos` do repo: 286, 166 e 84 sao valores
#    legitimos de recorte e fixture. O manifesto contra o seed roda com
#    `--seed` na maquina, onde o seed do v2 existe.
#
#    python3 scripts/verificar-shas-citados.py --estrito
#    python3 scripts/verificar-contagens.py --seed ../diretorio-contatos-v2/seed_mascarado.json --estrito

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shas:
    name: SHAs citados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Conferir SHAs citados nos docs
        run: |
          python3 scripts/verificar-shas-citados.py | tee -a "$GITHUB_STEP_SUMMARY"

  contagens:
    name: Contagens citadas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Conferir contagens contra o manifesto
        run: |
          python3 scripts/verificar-contagens.py | tee -a "$GITHUB_STEP_SUMMARY"


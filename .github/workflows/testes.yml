name: Testes

# Duas coisas ficam verdes antes de o repositório ficar público:
#
# 1. varredura — mesma régua do v2 (`tests/test_sem_telefone_real.py`), na versão
#    de bolso: `scripts/varrer_privacidade.py` sai com código 1 ao achar telefone
#    ou e-mail fora do padrão sintético. Leva ~5s e roda em paralelo com o DDL,
#    então continua sendo a primeira coisa a ficar vermelha.
# 2. ddl — aplica `db/schema.sql` num Postgres 16 de verdade, aplica de novo
#    (idempotência) e roda as invariantes estruturais de `db/verificar-schema.sql`.
#
# O seed fica de fora do CI de push de propósito: `SEED_JSON` mora no
# repositório do v2, e CI que depende de download de outro repositório falha
# por motivo que não é o código deste. As invariantes de carga (20) e de plano
# (5) continuam rodando à mão, com o seed ao lado:
#     SEED_JSON=../diretorio-contatos-v2/seed_mascarado.json ./db/testar-schema.sh
#
# A varredura do seed (`--seed`) é a única exceção e roda **só a pedido**
# (Actions → Run workflow), no job `seed`: ele clona o v2, que é público, e
# falha se o seed tiver telefone/e-mail fora do padrão sintético ou nome de
# pessoa. Não entra no push para não transformar indisponibilidade de outro
# repositório em vermelho deste. O `--autoteste` roda sempre: prova que o
# detector de nome não virou carimbo depois de alguém mexer na lista.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  varredura:
    name: Varredura de privacidade
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Varrer telefone e e-mail
        run: python3 scripts/varrer_privacidade.py
      - name: Autoteste do detector de nome de pessoa
        run: python3 scripts/varrer_privacidade.py --autoteste

  seed:
    name: Varredura do seed (a pedido)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Clonar o v2 (público) para ter o seed
        run: git clone --depth 1 https://github.com/EnzoMoulin/diretorio-contatos-v2 _v2
      - name: Varrer o seed (telefone, e-mail e nome de pessoa)
        run: python3 scripts/varrer_privacidade.py --seed _v2/seed_mascarado.json

  ddl:
    name: DDL e invariantes (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enzo
          POSTGRES_PASSWORD: enzo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: enzo
      PGPASSWORD: enzo
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar schema.sql duas vezes e rodar as invariantes
        run: bash db/testar-schema.sh

  # A paridade v2 × v3 é prova executável, mas ainda **não bloqueia**: a v3 só
  # expõe `/api/v1/hierarquia` e `/api/v1/busca`; faltam `locais`, `nos` e
  # `contatos`. Por isso este job roda a pedido, como o `seed`: ele clona o v2,
  # sobe a v3 com o seed real e compara o que já existe. Quando as rotas de
  # leitura estiverem todas no ar, o `--exigir-completo` passa a ser o padrão e
  # o job entra no push/PR — aí a paridade vira gate, não relatório.
  contrato:
    name: Contrato v2 × v3 (a pedido)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: enzo
          POSTGRES_PASSWORD: enzo
          POSTGRES_DB: diretorio_contrato
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: diretorio_contrato
      DB_USERNAME: enzo
      DB_PASSWORD: enzo
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      SEED_JSON: ${{ github.workspace }}/_v2/seed_mascarado.json
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, pgsql, bcmath, zip
          coverage: none
          tools: composer:v2
      - name: Cache do Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('apps/web/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Instalar dependências
        working-directory: apps/web
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Clonar o v2 (público) para ter o seed e o contrato
        run: git clone --depth 1 https://github.com/EnzoMoulin/diretorio-contatos-v2 _v2
      - name: Preparar ambiente
        working-directory: apps/web
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate --force
      - name: Migrar e semear com o seed real do v2
        working-directory: apps/web
        run: php artisan migrate --seed --force
      - name: Subir a v3 para a captura
        working-directory: apps/web
        run: |
          set -euo pipefail
          php artisan serve --host=127.0.0.1 --port=8001 > /tmp/laravel-contrato.log 2>&1 &
          echo $! > /tmp/laravel-contrato.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8001/up > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/laravel-contrato.log
          exit 1
      - name: Comparar o contrato (diff legível; rota pendente não falha)
        run: |
          set -o pipefail
          python3 scripts/comparar-contrato.py --v3 http://127.0.0.1:8001 \
            docs/paridade/esperado.json | tee contrato-v3.txt
      - name: Anexar o diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contrato-v2-v3
          path: contrato-v3.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Logs do servidor (só em falha)
        if: failure()
        run: cat /tmp/laravel-contrato.log 2>/dev/null || true
